# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy JAR app to Azure Web App: kbeauty-ai-core'

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Java version
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: mvn clean install

    # Le package deploye contient le jar applicatif (app.jar a la racine, nom
    # attendu par le conteneur Java SE d'Azure App Service) + l'agent APM New
    # Relic dans un sous-dossier. L'agent est active cote Azure via le reglage
    # JAVA_TOOL_OPTIONS=-javaagent:/home/site/wwwroot/newrelic/newrelic.jar
    # (cle de licence et nom d'appli fournis par les app settings NEW_RELIC_*).
    - name: Stage deployment package with New Relic agent
      run: |
        mkdir -p deploy
        curl -sfL -o /tmp/newrelic-java.zip https://download.newrelic.com/newrelic/java-agent/newrelic-agent/current/newrelic-java.zip
        unzip -oq /tmp/newrelic-java.zip -d deploy
        cp target/*.jar deploy/app.jar
        ls -R deploy

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'kbeauty-ai-core'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_4405b662f3b24003a677123948f21104 }}
        package: '${{ github.workspace }}/deploy'
